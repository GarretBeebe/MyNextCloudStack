# Mounted over the image's /etc/apache2/mods-available/mpm_prefork.conf (see docker-compose.yaml).
# MaxRequestWorkers keeps concurrent requests under Postgres max_connections (100) and bounds RAM.
# MaxConnectionsPerChild recycles workers periodically (image default 0 = never).
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers       40
    MaxConnectionsPerChild 1000
</IfModule>
