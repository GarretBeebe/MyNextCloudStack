services:
  db:
    container_name: ncdb
    image: postgres:15-bookworm
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=nextclouddb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${HOST_POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    labels:
      - com.centurylinklabs.watchtower.enable=false

  redis:
    container_name: ncredis
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    labels:
      - com.centurylinklabs.watchtower.enable=false

  app:
    container_name: nextcloud
    image: nextcloud:33
    restart: unless-stopped
    ports:
      - 5080:80

    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=nextclouddb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=ncadmin
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}

      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_DOMAIN=${MAIL_DOMAIN}

    volumes:
      - ./html:/var/www/html
      - ${HOST_NEXTCLOUD_DATA_DIR}:/var/www/html/data
      - /home/garret/NextCloud/php/zzz-opcache-tuning.ini:/usr/local/etc/php/conf.d/zzz-opcache-tuning.ini:ro

    depends_on:
      - db
      - redis

    dns:
      - 192.168.68.70
      - 1.1.1.1

    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  default:
    name: nextcloud
    driver: bridge
