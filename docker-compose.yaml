x-nextcloud: &nextcloud
  image: nextcloud:33.0.5
  restart: unless-stopped
  volumes:
    - ./html:/var/www/html
    - ${HOST_NEXTCLOUD_DATA_DIR}:/var/www/html/data
    - ${HOST_PHP_INI_PATH}:/usr/local/etc/php/conf.d/zzz-opcache-tuning.ini:ro
  depends_on:
    - db
    - redis

services:
  db:
    container_name: ncdb
    image: postgres:15.17-bookworm
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${HOST_POSTGRES_DATA_DIR}:/var/lib/postgresql/data

  redis:
    container_name: ncredis
    image: redis:7.4.8-bookworm
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru

  app:
    <<: *nextcloud
    container_name: nextcloud
    ports:
      - 5080:80
    environment:
      # database
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # admin
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # redis
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      # smtp
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_DOMAIN=${MAIL_DOMAIN}
    dns:
      - ${DNS_SERVER}

  cron:
    <<: *nextcloud
    container_name: nextcloud-cron
    entrypoint: /cron.sh

networks:
  default:
    name: nextcloud
    driver: bridge
