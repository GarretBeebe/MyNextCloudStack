x-nextcloud: &nextcloud
  image: nextcloud:34.0.4
  restart: unless-stopped
  volumes:
    - ./html:/var/www/html
    - ${HOST_NEXTCLOUD_DATA_DIR}:/var/www/html/data
    - ${HOST_PHP_INI_PATH}:/usr/local/etc/php/conf.d/zzz-opcache-tuning.ini:ro
    - ./apache/mpm_prefork.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    container_name: ncdb
    image: postgres:15.17-bookworm
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${HOST_POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ncredis
    image: redis:7.4.8-bookworm
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *nextcloud
    container_name: nextcloud
    ports:
      - 127.0.0.1:5080:80
    environment:
      # database
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # admin
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # redis
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      # smtp
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTHTYPE=${SMTP_AUTHTYPE}
      - SMTP_NAME=${SMTP_NAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      # reverse proxy: client IPs come only from X-Forwarded-For (see readme)
      - APACHE_DISABLE_REWRITE_IP=1
    dns:
      - ${DNS_SERVER}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q '\"installed\":true,\"maintenance\":false,\"needsDbUpgrade\":false'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
      start_interval: 5s

  cron:
    <<: *nextcloud
    container_name: nextcloud-cron
    entrypoint: /cron.sh
    # replaces the anchor's depends_on: wait for app so cron never runs mid-upgrade
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

networks:
  default:
    name: nextcloud
    driver: bridge
